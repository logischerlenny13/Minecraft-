#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(6,10,8,.42),rgba(6,10,8,.8))}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.5%,1.2%)}}
h1,h2,h3{margin:0 0 .6rem;font-weight:650;letter-spacing:-.02em}
h2{font-size:1.4rem}
h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:600}
p{margin:.4rem 0}
.card{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:.9rem}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;-webkit-appearance:none;appearance:none;transition:border-color .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);background:rgba(255,255,255,.11)}
input[type=checkbox]{width:auto}
input::placeholder,textarea::placeholder{color:var(--mute)}
select{background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:2rem}
option{color:#111}
textarea{min-height:90px}
label{display:block;color:var(--mute);font-size:.85rem;margin:.6rem 0 .25rem}
button{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;padding:.5rem .95rem;min-height:40px;cursor:pointer;transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s}
button:hover{background:rgba(255,255,255,.16)}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;pointer-events:none}
button.go{background:var(--green);color:#08140a;border-color:transparent;font-weight:650}
button.go:hover{background:var(--green);filter:brightness(1.1);box-shadow:0 6px 22px rgba(111,209,106,.35)}
button.bad{background:rgba(255,122,133,.16);border-color:rgba(255,122,133,.5)}
button.sm{min-height:32px;padding:.2rem .65rem;font-size:.85rem;border-radius:10px}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}
.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.nowrap{flex-wrap:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.9rem}
.cols>.card{margin-bottom:0}
.pos{color:var(--green)}.neg{color:var(--red)}.lbl,.empty{color:var(--mute)}.scroll{overflow-x:auto}.gold{color:var(--gold)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--mute);font-weight:500;font-size:.8rem}
.tag{display:inline-block;padding:0 .55rem;border-radius:99px;font-size:.78rem;border:1px solid var(--line)}.tag.r{border-color:var(--red);color:var(--red)}.tag.g{border-color:var(--green);color:var(--green)}.tag.y{border-color:var(--gold);color:var(--gold)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-left:.3rem;border-radius:99px;background:var(--red);font-size:.7rem;color:#fff}

/* Shell */
.shell{min-height:100vh;max-width:1140px;margin:auto;padding:env(safe-area-inset-top) 14px calc(100px + env(safe-area-inset-bottom))}
.statusbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--mute)}
.osbrand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;min-height:0;color:#fff;font-weight:700;letter-spacing:-.01em}
.osbrand:hover{background:none}.osbrand img{width:22px;height:22px;image-rendering:pixelated}
.timer{font-weight:650;color:var(--gold)}.timer small{color:#fff;font-weight:400;margin-right:.5rem}
.who{display:flex;align-items:center;gap:7px}
.online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,209,106,.6)}70%{box-shadow:0 0 0 7px rgba(111,209,106,0)}100%{box-shadow:0 0 0 0 rgba(111,209,106,0)}}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:middle;animation:pulseR 1.8s infinite}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(255,122,133,.6)}70%{box-shadow:0 0 0 7px rgba(255,122,133,0)}100%{box-shadow:0 0 0 0 rgba(255,122,133,0)}}
.apphead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.apphead h2{margin:0;flex:1}
.back{width:40px;height:40px;padding:0;border-radius:50%;font-size:1.4rem;line-height:1}

/* Dock */
.dock{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:7px;border-radius:22px;background:rgba(12,18,14,.8);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--line);z-index:50;max-width:calc(100vw - 16px);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.dock button{position:relative;width:48px;height:48px;min-height:0;padding:0;font-size:1.3rem;border:0;background:transparent;border-radius:15px}
.dock button:hover{transform:translateY(-5px) scale(1.14);background:rgba(255,255,255,.1)}
.dock button.on{background:rgba(111,209,106,.2)}
.dock button.on::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}

/* Home */
.hello{padding:5vh 4px 22px}
.hello small{color:var(--mute);letter-spacing:.06em}
.hello h1{font-size:clamp(2.1rem,6.5vw,3.8rem);letter-spacing:-.045em;margin:.05em 0 .3em;overflow-wrap:anywhere}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chipx{padding:.35rem .85rem;border-radius:99px;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:.9rem}
.homegrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:22px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:20px 8px}
.tile{position:relative;display:grid;justify-items:center;gap:8px;background:none;border:0;padding:4px;min-height:0;font-size:.82rem}
.tile:hover{background:none}
.tile .ic{width:68px;height:68px;border-radius:21px;display:grid;place-items:center;font-size:1.9rem;background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.03));border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.tile:hover .ic{transform:translateY(-6px) scale(1.08) rotate(-2deg);border-color:var(--green);box-shadow:0 18px 36px rgba(111,209,106,.25)}
.tile:active .ic{transform:scale(.92)}
.tile .badge{position:absolute;top:0;right:calc(50% - 40px)}
.newscard{margin:0}

/* News */
.news-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;padding:.65rem 0;border-bottom:1px solid var(--line);align-items:start}
.news-item:last-child{border:0}
.nic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.news-item small{display:block;color:var(--mute)}

/* Wallet */
.accounts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.9rem;margin-bottom:.9rem}
.acct{display:flex;flex-direction:column;gap:.2rem;text-align:left;padding:1.2rem 1.3rem;border-radius:22px;min-height:150px;justify-content:space-between;border:1px solid var(--line)}
.acct.me{background:linear-gradient(135deg,rgba(111,209,106,.38),rgba(10,15,12,.55))}.acct.team{background:linear-gradient(135deg,rgba(246,196,83,.36),rgba(10,15,12,.55))}
.acct.ghost{background:rgba(255,255,255,.05);border-style:dashed;cursor:default}.acct.sel{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}
.acct .big{font-size:2.3rem;font-weight:700;letter-spacing:-.02em}.acct .meta{color:var(--mute);font-size:.88rem}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;gap:2px;margin-bottom:.6rem}
.seg button{border:0;background:transparent;border-radius:999px}.seg button.on{background:rgba(255,255,255,.22)}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:.7rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}.tx small{display:block;color:var(--mute)}
.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700}.dot.p{background:rgba(111,209,106,.2);color:var(--green)}.dot.n{background:rgba(255,122,133,.2);color:var(--red)}

/* Shop */
.shophead{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:10px}
.chip-bal{display:flex;align-items:center;padding:0 1rem;border-radius:12px;background:var(--glass);border:1px solid var(--line);white-space:nowrap}
.cartbtn{position:relative}
.cats{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;border-radius:99px;min-height:34px;padding:.25rem .85rem;font-size:.88rem}
.cats button.on{background:#f2f5f1;color:#0a100c;border-color:transparent}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.product{background:rgba(12,18,14,.74);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.product:hover{transform:translateY(-4px);border-color:rgba(111,209,106,.5);box-shadow:0 14px 30px rgba(0,0,0,.4)}
.pa{position:relative;height:106px;display:grid;place-items:center;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.12),transparent 68%)}
.pa img{position:relative;z-index:1;width:64px;height:64px;object-fit:contain;image-rendering:pixelated;opacity:0;transition:opacity .3s,transform .35s var(--ease);filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.pa img.ok{opacity:1}.pa img.ok~.em{display:none}
.product:hover .pa img{transform:scale(1.16) rotate(-5deg)}
.pa .em{position:absolute;font-size:2.4rem;opacity:.5}
.pi{padding:11px;display:grid;gap:5px}
.pi h3{margin:0;font-size:.98rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:600;line-height:1.2}
.pi small{color:var(--mute)}
.price{color:var(--gold);font-weight:700}
.qty{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:5px}.qty button{min-height:34px;padding:0}.qty b{text-align:center}
.floating-cart{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(480px,calc(100vw - 28px));display:flex;justify-content:space-between;background:var(--green);color:#08140a;font-weight:650;border:0;border-radius:16px;padding:.8rem 1rem;box-shadow:0 14px 40px rgba(0,0,0,.55);z-index:40}
.floating-cart:hover{background:var(--green);filter:brightness(1.08)}
.floating-cart.bump{animation:bump .35s var(--ease)}
@keyframes bump{50%{transform:translateX(-50%) scale(1.05)}}
.checkout-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:12px;align-items:start}
.checkout-layout>.card{margin:0}
.cart-row{display:grid;grid-template-columns:48px 1fr auto auto;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.cart-row small{display:block;color:var(--mute)}.cart-row img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain}
.cart-step{display:flex;align-items:center;gap:7px}.cart-step button{min-height:32px;width:32px;padding:0}
.sum{display:flex;justify-content:space-between;font-size:1.15rem;margin:14px 0}.wide{width:100%;margin-top:12px}
.checkout{position:sticky;top:12px}

/* Admin / Aufträge */
.order{background:rgba(255,255,255,.06);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:16px;padding:.8rem;margin-bottom:.7rem}
.order .oh{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem}
.cmd{display:flex;gap:.4rem;align-items:center;margin:.35rem 0}
code{flex:1;background:rgba(0,0,0,.45);color:#9ff0a0;padding:.35rem .6rem;border-radius:12px;font:14px ui-monospace,Menlo,monospace;word-break:break-all}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:.9rem;align-items:start}
.compact{padding:.7rem .8rem;margin-bottom:.7rem}.compact h3{margin-bottom:.4rem}
.compact select,.compact input{padding:.35rem .6rem;font-size:.9rem;border-radius:10px}
.drow{display:flex;gap:.35rem;align-items:center;margin-bottom:.35rem}.drow select{flex:1;min-width:0}.drow span{color:var(--mute)}
.chk{display:flex;align-items:center;gap:.3rem;margin:0;white-space:nowrap;font-size:.85rem}.tiny{width:64px!important}
.pl{border-bottom:1px solid var(--line)}.pn{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;border-radius:10px;padding:.35rem .4rem;font-size:.95rem}.pn small{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;padding:.2rem .2rem .5rem}.chip{padding:.1rem .55rem;font-size:.8rem}
.warn{border-left:4px solid var(--red)}.hint{font-size:.82rem;margin:0 0 .4rem}
.tabs{display:flex;gap:.4rem;overflow-x:auto;margin:.6rem 0 .9rem;padding-bottom:2px;scrollbar-width:none}.tabs button{white-space:nowrap;border-radius:99px}.tabs button.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4)}
.bar{height:12px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:.2rem 0 .5rem}.bar i{display:block;height:100%;background:var(--green);transition:width .6s var(--ease)}
.pad{padding:.4rem 0;border-bottom:1px solid var(--line)}
.support-call{background:linear-gradient(135deg,rgba(123,224,230,.18),rgba(10,15,12,.55))}
.pagehead p{color:var(--mute);margin:0 0 .9rem}

/* Popup, Toast, Login */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,8,6,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:80;animation:fade .2s}
.sheet{width:min(360px,90vw);border-radius:28px;padding:1.6rem;text-align:center;display:grid;gap:.6rem;justify-items:center;animation:pop .3s var(--ease);margin:0}
.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(255,255,255,.15) 0);display:grid;place-items:center}
.ring span{width:106px;height:106px;border-radius:50%;background:rgba(10,15,12,.9);display:grid;place-items:center;font-size:2.6rem;font-weight:700}
.check{width:96px;height:96px}.check circle{fill:rgba(111,209,106,.2);stroke:var(--green);stroke-width:3;stroke-dasharray:152;stroke-dashoffset:152;animation:draw .5s forwards}
.check path{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .4s forwards}
.bad-x{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:rgba(255,122,133,.22);color:var(--red)}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.9);opacity:0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));display:grid;gap:.4rem;z-index:90}
#toast div{background:rgba(12,18,14,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);padding:.55rem 1rem;border-radius:999px;max-width:90vw;animation:toastin .4s var(--ease)}#toast .ok{border-color:var(--green)}#toast .err{border-color:var(--red)}
@keyframes toastin{from{opacity:0;transform:translateY(-14px) scale(.95)}}
.login{max-width:430px;margin:9vh auto;padding:1.4rem;border-radius:26px;animation:rise .6s var(--ease)}
.login h1{display:flex;align-items:center;gap:10px}.login h1 img{width:34px;height:34px;image-rendering:pixelated}

/* Animationen beim Seitenwechsel (nur direkt nach Navigation) */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes dockin{from{opacity:0;transform:translate(-50%,30px)}to{opacity:1;transform:translate(-50%,0)}}
.order.sell{border-left-color:var(--green)}
.order.fresh{animation:slidein .55s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(-24px) scale(.97)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.bad-x{animation:pop .35s var(--ease),shake .5s .15s}
.sheet .check{animation:pop .4s var(--ease)}
.confetti{position:fixed;top:42%;left:50%;font-size:1.4rem;pointer-events:none;z-index:95;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.badge{animation:badgepop 1.8s ease-in-out infinite}
@keyframes badgepop{50%{transform:scale(1.18)}}
.floating-cart{animation:dockin .5s var(--ease) both}
.ring{transition:background .4s linear}
.enter .hello,.enter .apphead,.enter .cats,.enter .shophead,.enter .card,.enter .tile,.enter .product,.enter .news-item,.enter .seg,.enter .tabs{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
.enter .card:nth-child(2){--i:2}.enter .card:nth-child(3){--i:4}.enter .card:nth-child(4){--i:6}
.enter .dock{animation:dockin .6s .1s var(--ease) both}
.enter .statusbar{animation:fade .6s both}

@media (max-width:860px){.qgrid,.homegrid,.checkout-layout{grid-template-columns:1fr}.checkout{position:static}}
@media (max-width:560px){.shell{padding-left:10px;padding-right:10px}.tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px 4px}.tile .ic{width:58px;height:58px;border-radius:18px;font-size:1.6rem}.tile{font-size:.72rem}.tile .badge{right:calc(50% - 34px)}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pa{height:88px}.pi{padding:9px}.cart-row{grid-template-columns:42px 1fr auto}.cart-row>b{grid-column:2/4}.shophead{grid-template-columns:1fr auto}.chip-bal{display:none}.dock{gap:2px}.dock button{width:44px}.dock button:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

      if (endgame) { if (!vs.exists() || vs.data().role !== "player") throw Error("Dieser Nutzer nimmt nicht an der Endphase teil"); if (vs.data().eliminated) throw Error("Spieler ist bereits ausgeschieden"); if (killer && ks.data().role === "player" && ks.data().eliminated) throw Error("Killer nimmt nicht aktiv an der Endphase teil"); }
      const live = []; for (const b of bs) { const s = await t.get(b.ref); if (s.exists() && s.data().active) live.push(s); }
      const total = live.reduce((x, s) => x + s.data().amount, 0);
      const newLives = endgame ? Math.max(0, (vs.data().lives ?? 3) - 1) : null;
      t.update(U(victim), { deaths: (vs.data().deaths ?? 0) + 1, ...(endgame ? { lives: newLives, eliminated: newLives === 0 } : {}) });
      if (killer) {
        const bal = ks.data().balance + cf.killReward + total;
        t.update(U(killer), { kills: (ks.data().kills ?? 0) + 1, balance: bal });
        addTx(t, killer, cf.killReward, `Kill: ${vs.data().gamertag}`, "kill", ks.data().balance + cf.killReward);
        if (total) addTx(t, killer, total, `Kopfgeld auf ${vs.data().gamertag}`, "bounty", bal);
        live.forEach((s) => t.update(s.ref, { active: false, claimedBy: ks.data().gamertag }));
        if (!endgame && bountyAmount > 0 && vs.data().teamId !== ks.data().teamId) t.set(doc(collection(db, "bounties")), { target: killer, targetName: ks.data().gamertag, placedBy: "Server", amount: bountyAmount, active: true, createdAt: serverTimestamp() });
      }
      t.set(doc(collection(db, "kills")), { victim, victimName: vs.data().gamertag, killer: killer || null, killerName: ks?.data().gamertag ?? null, by: r.gamertag, createdAt: serverTimestamp() });
      newsTx(t, "kill", killer ? `${vs.data().gamertag} wurde von ${ks.data().gamertag} getötet${total ? ` – ${fmt(total)} Coins Kopfgeld kassiert` : ""}` : `${vs.data().gamertag} ist gestorben`);
      if (killer && !endgame && bountyAmount > 0 && vs.data().teamId !== ks.data().teamId) newsTx(t, "bounty", `Auf ${ks.data().gamertag} wurde ein Kopfgeld von ${fmt(bountyAmount)} Coins ausgesetzt`);
      if (endgame && newLives === 0) newsTx(t, "kill", `☠ ${vs.data().gamertag} IST AUSGESCHIEDEN`);
      return killer ? `${vs.data().gamertag} wurde von ${ks.data().gamertag} getötet${total ? ` (Kopfgeld ${total})` : ""}` : `${vs.data().gamertag} ist gestorben`;
    });
  },
};

}async function drain() {
  if (busy) return;
  busy = true;
  try {
    while (queue.length) {
      const d = queue.shift(), ref = d.ref;
    try {
      await runTransaction(db, async (t) => { const s = await t.get(ref); if (!s.exists()) throw Error("skip"); const x = s.data(); const proc = x.procAt?.toMillis ? x.procAt.toMillis() : Number(x.procAt || 0); const stale = x.status === "processing" && ["sell", "cart", "buy"].includes(x.type) && Date.now() - proc > 30000; if (x.status !== "pending" && !stale) throw Error("skip"); t.update(ref, { status: "processing", procAt: serverTimestamp() }); });
    } catch { continue; }
    try {
      const r = d.data(), ru = (await getDoc(U(r.uid))).data();
      if (!ru || ru.status !== "active" || !H[r.type]) throw Error("Ungültige Anfrage");
      const res = await H[r.type]({ ...r, id: d.id, requestId: d.id, role: ru.role, gamertag: ru.gamertag });
      await updateDoc(ref, { status: "done", result: res.msg ?? res, orderId: res.orderId ?? null });
    } catch (e) { await updateDoc(ref, { status: "error", result: e.message }).catch(() => {}); }
    }
  }
  finally {
    busy = false;
    if (queue.length && isStaff()) queueMicrotask(() => drain().catch((e) => console.warn("Anfrage-Verarbeitung:", e)));
  }
}

async function setPhase(phase, min, next) {
  const ph = PH[phase]; if (!ph) throw Error("Unbekannte Phase");
  const data = { phase, label: ph.label, endsAt: min ? Timestamp.fromMillis(Date.now() + min * 60000) : null, next: next || null };
  if (phase === "end") data.endgame = true;
  await setDoc(doc(db, "events", "state"), data);
  await order(`Phase: ${ph.label}`, ph.cmds());
  newsAdd("phase", `Neue Phase: ${ph.label}${min ? ` (${min} Min)` : ""}`).catch(() => {});
  if (phase === "minigame") await openMinigameVote();
  if (phase === "end") {
    const ps = participants();
    const pids = new Set(ps.map((u) => u.id));
    const batch = writeBatch(db);
    active().forEach((u) => batch.update(U(u.id), pids.has(u.id) ? { lives: 3, eliminated: false } : { lives: null, eliminated: false }));
    await batch.commit();
    newsAdd("phase", `Endphase gestartet · ${ps.length} Spieler haben ❤️❤️❤️`).catch(() => {});

function exportShopCSV() {
  const items = Array.isArray(S.shop) ? S.shop : [];
  if (!items.length) throw Error("Keine Shop-Artikel geladen.");
  const keys = [...new Set(items.flatMap((it) => Object.keys(it || {})))];
  const cleanCell = (v) => {
    if (v == null) return "";
    if (typeof v === "object") {
      if (typeof v.toMillis === "function") return new Date(v.toMillis()).toISOString();
      if (Array.isArray(v)) return JSON.stringify(v);
      if (typeof v.seconds === "number" && typeof v.nanoseconds === "number") return new Date(v.seconds * 1000 + Math.floor(v.nanoseconds / 1e6)).toISOString();
      try { return JSON.stringify(v); } catch { return String(v); }
    }
    return String(v);
  };
  const csv = [keys, ...items.map((it) => keys.map((k) => cleanCell(it[k])))].map((row) => row.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `realmos-shop-items-${items.length}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast(`${items.length} Artikel als CSV exportiert`, "ok");
}

function playerList() {
  const ql = S.q.trim().toLowerCase(), chip = (a, id, l) => `<button class="chip sm ${a === "ban" ? "bad" : ""}" data-act="${a}" data-id="${id}">${l}</button>`;
  const rows = active().filter((u) => !ql || u.gamertag.toLowerCase().includes(ql)).map((u) => `<div class="pl"><button class="pn" data-act="pOpen" data-id="${u.id}"><span>${esc(u.gamertag)}</span><small>🪙 ${fmt(u.balance)} ${S.openUser === u.id ? "▴" : "▾"}</small></button>${S.openUser === u.id ? `<div class="chips">${[["victim", "☠ Tod"], ["freeze", "🧊 Freeze"], ["unfreeze", "Auftauen"], ["jail", "🔒 Knast"], ["unjail", "🔓 Raus"], ["warn", "⚠ Warn"], ["kick", "👢 Kick"], ["ban", "🔨 Bann"], ["ghost", "👻 Ghost"]].map(([a, l]) => chip(a, u.id, l)).join("")}</div>` : ""}</div>`).join("");
  return '<p class="lbl hint">Tippe auf einen Spieler für Aktionen</p>' + (rows || '<p class="empty">Keine Treffer.</p>') + `<p style="margin:.5rem 0 0"><button class="sm" data-act="unghost">Wieder sichtbar</button></p>`;
}

/* ===== Bestell-Popup ===== */
function closePop() { S.pop?.un.forEach((f) => f()); S.pop = null; renderModal(); }
function trackOrder(ref, title, kind, onAccepted) {
  const p = (S.pop = { title, kind, start: Date.now(), duration: 60, phase: "wait", msg: "", reqStatus: "pending", un: [] });
  p.un.push(onSnapshot(ref, (d) => {
    const x = d.data(); if (S.pop !== p || !x) return;
    p.reqStatus = x.status;
    if (x.status === "error") { p.phase = "error"; p.msg = x.result || "Fehlgeschlagen"; }
    if (x.status === "done") {
      onAccepted?.();
      if (x.orderId && !p.watch) {
        p.watch = true;
        p.un.push(onSnapshot(doc(db, "orders", x.orderId), (o) => {
          if (S.pop !== p) return;
          const st = o.data()?.status;
          if (st === "done") { p.phase = "done"; renderModal(); }
          else if (st === "rejected") { p.phase = "rejected"; renderModal(); }
        }));
      }
    }
    renderModal();
  }, () => {}));
  renderModal();
}
function burst() {
  if (reduce) return; const m = $("#modal");
  for (let i = 0; i < 22; i++) {
    const z = document.createElement("span"); z.className = "confetti"; z.textContent = ["🪙", "✨", "🎉", "💎"][i % 4];
    z.style.setProperty("--x", Math.random() * 420 - 210 + "px"); z.style.setProperty("--y", -Math.random() * 320 - 40 + "px"); z.style.setProperty("--r", Math.random() * 540 - 270 + "deg");
    m.append(z); setTimeout(() => z.remove(), 1200);
  }
}
function renderModal() {
  const m = $("#modal"), p = S.pop;
  if (!p) { m.innerHTML = ""; m.dataset.k = ""; return; }
  const dur = p.duration, left = Math.max(0, dur - Math.floor((Date.now() - p.start) / 1000));
  const key = [p.phase, p.msg, left === 0, p.reqStatus].join("|");
  if (p.phase === "wait" && m.dataset.k === key) { const ring = m.querySelector(".ring"); if (ring) { ring.style.setProperty("--p", (left / dur) * 100); ring.querySelector("span").textContent = left; } return; }
  m.dataset.k = key;
  const sell = p.kind === "sell"; let body;
  if (p.phase === "done") body = `<svg class="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M14 27l8 8 16-17"/></svg><h2>${sell ? "Verkauf angenommen" : "Auftrag ausgeführt"}</h2><p class="lbl">${sell ? "Deine Coins wurden gutgeschrieben." : "Deine Bestellung wurde geliefert. Viel Spaß!"}</p><button class="go" data-act="popClose">Super</button>`;
  else if (p.phase === "rejected") body = `<div class="bad-x">✕</div><h2>${sell ? "Verkauf abgelehnt" : "Abgelehnt"}</h2><p class="lbl">${sell ? "Der Admin hat den Verkauf abgelehnt. Du bekommst keine Coins." : "Der Admin hat den Auftrag abgelehnt."}</p><button data-act="popClose">Schließen</button>`;
  else if (p.phase === "error") body = `<div class="bad-x">✕</div><h2>${sell ? "Verkauf" : "Kauf"} fehlgeschlagen</h2><p class="lbl">${esc(p.msg)}</p><button data-act="popClose">Schließen</button>`;
  else body = `<div class="ring" style="--p:${(left / dur) * 100}"><span>${left}</span></div><h2>${sell ? "Verkauf wird geprüft" : "Auftrag wird ausgeführt"}</h2><p class="lbl">${p.reqStatus === "done" ? "Dein Auftrag ist beim Admin eingegangen und wartet auf Bestätigung." : left === 0 ? "Das dauert etwas länger. Dein Auftrag bleibt offen." : "Das kann einen Moment dauern."}</p>${left === 0 ? `<button data-act="popClose">Schließen</button>` : ""}`;
  m.innerHTML = `<div class="overlay"><div class="card sheet" role="dialog" aria-live="polite">${body}</div></div>`;
  if (p.phase === "done") burst();
}
setInterval(() => { if (S.pop?.phase === "wait") renderModal(); }, 1000);;
document.addEventListener("input", (e) => {
  if (e.target.id === "pq") { S.q = e.target.value; $("#plist").innerHTML = playerList(); }
  if (e.target.id === "admQ") { S.admQ = e.target.value; $("#admList").innerHTML = admShopList(); }
  if (e.target.id === "shopSearch") { S.shopQ = e.target.value; S.shopLimit = 60; clearTimeout(window.__sq); window.__sq = setTimeout(shopRefresh, 160); }
  if (e.target.id === "sellSearch") { S.sellQ = e.target.value; S.sellLimit = 60; clearTimeout(window.__ssq); window.__ssq = setTimeout(() => render(true), 160); }
});

render(true);
</script>
</body>
